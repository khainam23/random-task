<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="64" y2="64" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#1d4ed8"/>
      <stop offset="100%" stop-color="#3b82f6"/>
    </linearGradient>
    <linearGradient id="shine" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="rgba(255,255,255,0.22)"/>
      <stop offset="100%" stop-color="rgba(255,255,255,0)"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="1.5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Background rounded square -->
  <rect width="64" height="64" rx="14" fill="url(#bg)"/>
  <rect width="64" height="64" rx="14" fill="url(#shine)"/>

  <!-- Jar lid -->
  <rect x="20" y="14" width="24" height="6" rx="3" fill="white" opacity="0.9"/>
  <!-- Lid highlight -->
  <rect x="22" y="15" width="10" height="2" rx="1" fill="white" opacity="0.5"/>

  <!-- Jar body -->
  <rect x="17" y="20" width="30" height="28" rx="6" fill="white" opacity="0.15"/>
  <rect x="17" y="20" width="30" height="28" rx="6" stroke="white" stroke-width="1.5" stroke-opacity="0.6"/>

  <!-- Glass shine on jar -->
  <rect x="20" y="23" width="6" height="14" rx="3" fill="white" opacity="0.12"/>

  <!-- Stars / sparkles inside jar -->
  <g filter="url(#glow)" fill="white">
    <!-- Big star -->
    <circle cx="32" cy="33" r="2.2" opacity="0.95"/>
    <!-- Small dots -->
    <circle cx="25" cy="29" r="1.2" opacity="0.7"/>
    <circle cx="39" cy="30" r="1.0" opacity="0.65"/>
    <circle cx="28" cy="38" r="0.9" opacity="0.6"/>
    <circle cx="37" cy="38" r="1.1" opacity="0.7"/>
  </g>

  <!-- Bottom label area -->
  <rect x="21" y="42" width="22" height="4" rx="2" fill="white" opacity="0.18"/>
</svg>
